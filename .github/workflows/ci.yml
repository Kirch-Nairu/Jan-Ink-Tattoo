name: Jan Ink CI

on:
  push:
    branches:
      - main
      - KIRCH-JANINK-ASSET-CONTENT-V1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify portfolio assets
        run: npm run verify-assets

      - name: Production build
        run: npm run build
